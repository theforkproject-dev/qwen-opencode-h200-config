    MODEL='qwen3.8-opencode'\nMAX_BODY=4*1024*1024\nMAX_OUTPUT=8192\nKEY_HASH=os.environ['QWEN_KEY_SHA256']\n\
    BACKEND=os.environ.get('QWEN_BACKEND','model:8000')\nassert len(KEY_HASH)==64 and all(c in '0123456789abcdef'\
    \ for c in KEY_HASH)\nactive=threading.BoundedSemaphore(1)\n\ndef unique(pairs):\n d={}\n for k,v\
    \ in pairs:\n  if k in d:raise ValueError('duplicate key')\n  d[k]=v\n return d\n\ndef validate(b):\n\
    \ if not isinstance(b,dict):raise ValueError('object required')\n fields={'model','messages','tools','tool_choice','parallel_tool_calls','stream','stream_options','temperature','top_p','top_k','max_tokens','max_completion_tokens','stop','seed','presence_penalty','frequency_penalty','repetition_penalty','chat_template_kwargs','response_format','reasoning_effort'}\n\
    \ if set(b)-fields:raise ValueError('unsupported field')\n if b.get('model')!=MODEL:raise ValueError('unknown\
    \ model')\n if type(b.get('stream',False)) is not bool:raise ValueError('stream must be boolean')\n\
    \ msgs=b.get('messages')\n if not isinstance(msgs,list) or not 1<=len(msgs)<=512:raise ValueError('messages\
    \ required')\n for m in msgs:\n  if not isinstance(m,dict) or set(m)-{'role','content','name','tool_calls','tool_call_id'}:raise\
    \ ValueError('invalid message')\n  if m.get('role') not in {'system','user','assistant','tool','developer'}:raise\
    \ ValueError('invalid role')\n  c=m.get('content')\n  if c is not None and not isinstance(c,str):\n\
    \   if not isinstance(c,list) or any(not isinstance(v,dict) or set(v)!={'type','text'} or v.get('type')!='text'\
    \ or not isinstance(v.get('text'),str) for v in c):raise ValueError('text only')\n  if 'tool_calls'\
    \ in m:\n   if not isinstance(m['tool_calls'],list):raise ValueError('invalid tool calls')\n   for\
    \ tc in m['tool_calls']:\n    if not isinstance(tc,dict) or tc.get('type')!='function' or not isinstance(tc.get('function'),dict):raise\
    \ ValueError('function only')\n tools=b.get('tools',[])\n if not isinstance(tools,list) or len(tools)>64:raise\
    \ ValueError('too many tools')\n for t in tools:\n  if not isinstance(t,dict) or set(t)-{'type','function'}\
    \ or t.get('type')!='function' or not isinstance(t.get('function'),dict):raise ValueError('function\
